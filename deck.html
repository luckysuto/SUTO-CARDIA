<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUTO CARDIA | デッキ編集</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1322;color:#edf4ff}header{background:#15243b;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #344966}header h1{font-size:1.15rem;margin:0}a{color:#bed5ff}main{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);gap:15px}section{background:#15243b;border:1px solid #344966;border-radius:13px;padding:15px;min-width:0}h2{margin:0 0 12px;font-size:1.05rem}input,select,button{font:inherit;border-radius:8px;padding:10px;color:#f0f5ff}input,select{background:#0d1a2e;border:1px solid #4b6081;width:100%}button{background:#355a91;border:1px solid #6486b4;cursor:pointer}button:hover:not(:disabled){background:#4772b1}button:disabled{opacity:.4;cursor:default}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px;margin-bottom:10px}.scroll{max-height:64vh;overflow:auto;display:grid;gap:7px;padding-right:3px}.item{background:#1e304a;border:1px solid #364f71;border-radius:9px;padding:9px;display:flex;gap:9px;justify-content:space-between;align-items:center}.info{min-width:0;flex:1}.name{font-weight:700;overflow-wrap:anywhere}.meta{font-size:.79rem;color:#b5c9e5;margin-top:3px}.effect{font-size:.77rem;color:#c6d4e7;margin-top:4px;overflow-wrap:anywhere}.controls{display:flex;gap:6px;align-items:center}.controls button{min-width:39px;padding:8px}.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.small{font-size:.85rem;color:#b7c9e4}.notice{min-height:24px;color:#a8e4c6;font-size:.9rem}.warn{color:#ffd39a}.summary{background:#0e1c30;border-radius:8px;padding:10px;margin:10px 0;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.actions button{flex:1}.counter{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem}#deckList{max-height:49vh}#loading{margin:10px 0;color:#f8c998}@media(max-width:820px){main{grid-template-columns:1fr}.scroll{max-height:47vh}#deckList{max-height:45vh}}@media(max-width:460px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.top{grid-template-columns:1fr}.item{align-items:flex-start}.controls{flex-shrink:0}}
</style></head><body>
<header><h1>SUTO CARDIA｜デッキ編集</h1><a href="index.html">ホームへ戻る</a></header>
<main>
<section><h2>カード一覧</h2><p class="small">設計テスト用：現在は全500種類を選択できます。正式版では所持カードだけを使用できます。</p><div class="tools"><input id="search" placeholder="名前・ID・能力で検索" aria-label="カード検索"><select id="type"><option value="">全種類</option></select><select id="rarity"><option value="">全レアリティ</option></select></div><div id="loading">カードデータを読み込み中…</div><div id="cardList" class="scroll"></div></section>
<section><h2>マイデッキ</h2><div class="top"><select id="slot" aria-label="保存先"></select><input id="deckName" maxlength="32" placeholder="デッキ名" aria-label="デッキ名"></div><div class="bar"><span>デッキ枚数 <span class="counter" id="count">0 / 40</span></span><span id="rareCount" class="small">★6・★7：0 / 8</span></div><div id="summary" class="summary small">カードを追加してください。</div><div class="actions"><button id="save">この枠に保存</button><button id="load">この枠を読込</button><button id="clear">編集中を空にする</button></div><div id="notice" class="notice" role="status"></div><div id="deckList" class="scroll"></div><p class="small">40枚ちょうどで保存。同名は3枚まで。★6と★7の合計は8枚まで。保存先は最大10枠。データはこの端末のブラウザ内に保存され、Firebaseにはまだ同期しません。</p></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id), STORAGE='suto-cardia-decks-v1';let cards=[],byId=new Map(),deck=[],saved={},filterTimer;
const make=(tag,cls,txt)=>{let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=String(txt);return x};
function notice(msg,bad=false){$('notice').textContent=msg;$('notice').className=bad?'notice warn':'notice'}
function loadSaved(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');saved=x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch{saved={}}}
function count(id){return deck.filter(x=>x===id).length}
function rareCount(){return deck.filter(id=>(byId.get(id)?.rarity||0)>=6).length}
function validAdd(c){if(deck.length>=40)return '40枚が上限です';if(count(c.id)>=3)return '同名カードは3枚までです';if(c.rarity>=6&&rareCount()>=8)return '★6・★7は合計8枚までです';return ''}
function cardRow(c,inDeck=false){const row=make('div','item'),info=make('div','info'),name=make('div','name',c.name),meta=make('div','meta',`${c.id}｜${c.type}｜${c.element||'無属性'}｜★${c.rarity}｜コスト${c.cost}`),ctrl=make('div','controls');info.append(name,meta);if(!inDeck)info.append(make('div','effect',String(c.effect||'').slice(0,100)));if(inDeck){const n=count(c.id);ctrl.append(make('span','small',`${n}枚`));const b=make('button','','−');b.title='1枚減らす';b.addEventListener('click',()=>{const i=deck.indexOf(c.id);if(i>=0){deck.splice(i,1);render()}});ctrl.append(b)}else{ctrl.append(make('span','small',`${count(c.id)}/3`));const b=make('button','','＋');b.title='1枚追加';b.disabled=!!validAdd(c);b.addEventListener('click',()=>{const err=validAdd(c);if(err){notice(err,true);return}deck.push(c.id);render()});ctrl.append(b)}row.append(info,ctrl);return row}
function renderCards(){const q=$('search').value.trim().toLocaleLowerCase('ja'),t=$('type').value,r=$('rarity').value,list=$('cardList');list.replaceChildren();let matches=cards.filter(c=>(!q||[c.id,c.name,c.effect].some(v=>String(v||'').toLocaleLowerCase('ja').includes(q)))&&(!t||c.type===t)&&(!r||String(c.rarity)===r));for(const c of matches.slice(0,100))list.append(cardRow(c));if(matches.length>100)list.append(make('p','small',`最初の100種類を表示中（全${matches.length}件）。検索で絞り込んでください。`));if(!matches.length)list.append(make('p','small','該当カードはありません。'))}
function renderDeck(){const list=$('deckList');list.replaceChildren();const ids=[...new Set(deck)];for(const id of ids){const c=byId.get(id);if(c)list.append(cardRow(c,true))}if(!ids.length)list.append(make('p','small','まだカードがありません。'));$('count').textContent=`${deck.length} / 40`;$('rareCount').textContent=`★6・★7：${rareCount()} / 8`;const cost=deck.reduce((n,id)=>n+(byId.get(id)?.cost||0),0),unit=deck.filter(id=>byId.get(id)?.type==='ユニット').length;const types={};for(const id of deck){const c=byId.get(id);if(c)types[c.element]=(types[c.element]||0)+1}$('summary').textContent=`ユニット ${unit}枚｜その他 ${deck.length-unit}枚｜平均コスト ${deck.length?(cost/deck.length).toFixed(2):'—'}｜属性 ${Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([e,n])=>e+n).join('・')||'—'}`}
function render(){renderDeck();renderCards()}
function validDeck(ids){if(!Array.isArray(ids)||ids.length!==40)return 'デッキは40枚ちょうど必要です';const ct=new Map();let rare=0;for(const id of ids){const c=byId.get(id);if(!c)return '存在しないカードが含まれています';ct.set(id,(ct.get(id)||0)+1);if(ct.get(id)>3)return '同名カードが4枚以上あります';if(c.rarity>=6)rare++}if(rare>8)return '★6・★7の合計が8枚を超えています';return ''}
$('save').addEventListener('click',()=>{const err=validDeck(deck);if(err){notice(err,true);return}const slot=$('slot').value;const name=$('deckName').value.trim()||`デッキ${slot}`;saved[slot]={name,cards:[...deck]};try{localStorage.setItem(STORAGE,JSON.stringify(saved));notice(`「${name}」を保存しました（枠${slot}）。`)}catch{notice('保存できませんでした。ブラウザの保存設定・空き容量を確認してください。',true)}});
$('load').addEventListener('click',()=>{const slot=$('slot').value,obj=saved[slot];if(!obj){notice('この枠にはまだ保存されていません。',true);return}const err=validDeck(obj.cards);if(err){notice('保存データが不正です：'+err,true);return}deck=[...obj.cards];$('deckName').value=String(obj.name||'').slice(0,32);notice(`枠${slot}を読み込みました。`);render()});
$('clear').addEventListener('click',()=>{if(deck.length&&!confirm('編集中のカード40枚をすべて外しますか？ 保存済みデッキは消えません。'))return;deck=[];notice('編集中のデッキを空にしました。');render()});
$('slot').addEventListener('change',()=>{$('deckName').value=saved[$('slot').value]?.name||'';notice('保存先を選択しました。「この枠を読込」で内容を読み込めます。')});
$('search').addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(renderCards,100)});for(const id of ['type','rarity'])$(id).addEventListener('change',renderCards);
for(let i=1;i<=10;i++){const op=make('option','',`保存枠 ${i}`);op.value=String(i);$('slot').append(op)}loadSaved();$('deckName').value=saved['1']?.name||'';
fetch('./cards.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{if(!Array.isArray(data.cards)||data.cards.length!==500)throw Error('カードデータの形式が正しくありません');cards=data.cards;byId=new Map(cards.map(c=>[c.id,c]));for(const [id,values] of [['type',cards.map(c=>c.type)],['rarity',cards.map(c=>c.rarity)]])for(const v of [...new Set(values)].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))){const op=make('option','',id==='rarity'?`★${v}`:v);op.value=String(v);$(id).append(op)}$('loading').textContent='';render()}).catch(e=>{$('loading').textContent='読み込み失敗：'+e.message+'。cards.jsonとdeck.htmlを同じ場所に置いてください。';notice('カードデータが読み込めません。',true)});
</script></body></html>
