<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUTO CARDIA | CPU対戦試作</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#09121f;color:#edf3ff}header{padding:14px 18px;background:#14243a;display:flex;justify-content:space-between;align-items:center}a{color:#a9d1ff}main{max-width:1080px;margin:auto;padding:14px}.panel{border:1px solid #39516f;background:#15253b;border-radius:12px;padding:13px;margin-bottom:12px}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.slot{min-height:102px;background:#0c1a2c;border:1px dashed #536887;border-radius:10px;padding:8px;text-align:center}.slot strong{display:block;overflow-wrap:anywhere;font-size:.87rem}.slot small{display:block;color:#b4c5df;margin:4px 0}.slot button{font-size:.78rem;padding:5px}button,select{font:inherit;border:1px solid #6b8ab3;background:#315687;color:white;border-radius:8px;padding:9px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}select{background:#0e1c30;max-width:100%}.hand{display:flex;gap:8px;overflow-x:auto;padding:9px 0}.card{min-width:155px;max-width:155px;background:#233b59;border:1px solid #7893ba;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}.card strong{overflow-wrap:anywhere}.card small{color:#d1dded}.card button{margin-top:auto}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.message{min-height:40px;color:#ffe4a8;white-space:pre-wrap}.muted{color:#b4c4dc;font-size:.86rem}h2{font-size:1.05rem;margin:4px 0 10px}@media(max-width:600px){.slot{min-height:120px;padding:5px}.slot strong{font-size:.72rem}.slot small{font-size:.7rem}.slot button{padding:5px;font-size:.7rem}}
</style></head><body><header><b>SUTO CARDIA｜CPU対戦（試作）</b><a href="index.html">ホーム</a></header><main><div class="panel"><h2>対戦準備</h2><div class="controls"><label>使用デッキ <select id="decks"></select></label><button id="start" disabled>対戦開始</button><a href="deck.html">デッキを編集</a></div><p class="muted">保存済み40枚デッキを読み込みます。CPUは簡易AIです。オンライン対戦・効果処理・前後列・属性補正などは今後実装します。</p><div id="notice" class="message" role="status">カードデータを読み込み中…</div></div><div id="game" hidden><div class="panel"><div class="stats"><strong>CPU プレイヤーHP <span id="ehp">50</span>｜拠点HP <span id="ebase">60</span></strong><span>CPU手札 <span id="ecards">5</span>枚</span></div><div id="enemy" class="slots"></div></div><div class="panel"><div class="stats"><strong>あなた プレイヤーHP <span id="php">50</span>｜拠点HP <span id="pbase">60</span></strong><span>山札 <span id="remaining">35</span>枚</span></div><div id="mine" class="slots"></div><div class="controls"><b>ターン <span id="turn">1</span></b><span id="phase"></span><button id="end">ターン終了</button></div></div><div class="panel"><h2>手札（枚数上限なし）</h2><p class="muted">カードを出すには、そのカード以外の手札をコスト枚数分捨てます。ユニットを出したターンは攻撃できません。ユニットの攻撃先は空き状況に応じて自動選択されます。</p><div id="hand" class="hand"></div></div><div class="panel"><h2>戦闘ログ</h2><div id="log" class="message" aria-live="polite"></div></div></div></main><script>
'use strict';
const $=x=>document.getElementById(x),STORE='suto-cardia-decks-v1';let cards=[],map=new Map(),saved={},state=null;
function note(s){$('notice').textContent=s}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function card(id){return map.get(id)}function unit(c){return c&&String(c.type).includes('ユニット')}function num(v,f=0){const n=Number(v);return Number.isFinite(n)?n:f}function stat(c,k,def){return Math.max(0,num(c[k],def))}function addLog(s){$('log').textContent=s+'\n'+$('log').textContent.slice(0,1200)}
function draw(who,n){for(let i=0;i<n;i++){if(!who.deck.length){if(who===state.me){finish(false,'山札切れ');return false}finish(true,'CPUの山札切れ');return false}who.hand.push(who.deck.pop())}return true}
function finish(win,reason){state.over=true;addLog((win?'勝利！':'敗北…')+'（'+reason+'）');$('end').disabled=true;render()}
function makeSide(deck){return{deck:shuffle([...deck]),hand:[],field:[null,null,null],hp:50,base:60}}
function start(){const id=$('decks').value,entry=saved[id];if(!entry||!Array.isArray(entry.cards)||entry.cards.length!==40){note('40枚の保存済みデッキを選んでください');return}if(entry.cards.some(id=>!map.has(id))){note('デッキに存在しないカードがあります');return}const pool=cards.filter(unit);if(!pool.length){note('ユニットカードが見つかりません');return}const cpu=Array.from({length:40},()=>pool[Math.floor(Math.random()*pool.length)].id);state={me:makeSide(entry.cards),cpu:makeSide(cpu),turn:1,over:false,first:true};$('game').hidden=false;$('log').textContent='';$('end').disabled=false;draw(state.me,5);draw(state.cpu,5);addLog('対戦開始！先攻の最初のターンはドローなし。');note('対戦中');render()}
function power(c){return Math.max(1,Math.floor(stat(c,'atk',12)-.35*stat(c,'def',0)))}
function attack(from,to,i,player){if(state.over)return;const u=from.field[i];if(!u||u.used||u.newborn)return;const target=to.field.findIndex(Boolean);const damage=Math.max(1,Math.floor(power(u.card)/4));if(target>=0){const t=to.field[target];const dmg=Math.max(1,Math.floor(stat(u.card,'atk',12)-.35*stat(t.card,'def',0)));t.hp-=dmg;addLog(`${player?'あなた':'CPU'}の「${u.card.name}」が「${t.card.name}」に${dmg}ダメージ`);if(t.hp<=0){addLog(`「${t.card.name}」が退場`);to.field[target]=null}}else{to.base-=damage;addLog(`${player?'あなた':'CPU'}の直接攻撃！拠点に${damage}ダメージ`);if(to.base<=0){finish(player,'拠点破壊');return}}u.used=true;render()}
function summon(from,c,idx){const pos=from.field.findIndex(x=>!x);if(pos<0)return false;from.field[pos]={card:c,hp:stat(c,'hp',80)||80,used:true,newborn:true};from.hand.splice(idx,1);return true}
function play(i){if(!state||state.over)return;const me=state.me,c=card(me.hand[i]);if(!c)return;const cost=Math.max(0,Math.floor(stat(c,'cost',0)));if(me.hand.length-1<cost){addLog('手札がコスト分足りません');return}if(!unit(c)){addLog('この試作ではユニット以外のカード効果は未実装です');return}if(me.field.every(Boolean)){addLog('ユニット枠が満員です');return}const discarded=[];for(let j=me.hand.length-1;j>=0&&discarded.length<cost;j--)if(j!==i)discarded.push(me.hand.splice(j,1)[0]);const newIndex=me.hand.indexOf(c.id);if(newIndex<0||!summon(me,c,newIndex)){addLog('召喚できませんでした');return}addLog(`「${c.name}」を召喚。コスト${cost}枚を捨てた。`);render()}
function cpuTurn(){if(state.over)return;const cpu=state.cpu;draw(cpu,2);if(state.over)return;for(let tries=0;tries<3;tries++){const idx=cpu.hand.findIndex((id,i)=>unit(card(id))&&stat(card(id),'cost',0)<=cpu.hand.length-1&&cpu.field.some(x=>!x));if(idx<0)break;const c=card(cpu.hand[idx]),cost=Math.max(0,Math.floor(stat(c,'cost',0)));for(let j=cpu.hand.length-1,n=0;j>=0&&n<cost;j--)if(j!==idx){cpu.hand.splice(j,1);n++}const at=cpu.hand.indexOf(c.id);if(at>=0&&summon(cpu,c,at))addLog(`CPUが「${c.name}」を召喚`)}for(let i=0;i<3;i++)attack(cpu,state.me,i,false);if(state.over)return;for(const u of cpu.field)if(u){u.used=false;u.newborn=false}state.turn++;if(!draw(state.me,2))return;for(const u of state.me.field)if(u){u.used=false;u.newborn=false}addLog(`あなたのターン ${state.turn}`);render()}
function endTurn(){if(!state||state.over)return;addLog('ターン終了');cpuTurn()}
function render(){if(!state)return;const{me,cpu}=state;for(const[id,v]of[['php',me.hp],['pbase',me.base],['ehp',cpu.hp],['ebase',cpu.base],['ecards',cpu.hand.length],['remaining',me.deck.length],['turn',state.turn]])$(id).textContent=v;$('phase').textContent=state.over?'対戦終了':'あなたの行動中';$('end').disabled=state.over;for(const [node,side,enemy]of[['mine',me,false],['enemy',cpu,true]]){$(node).replaceChildren();side.field.forEach((u,i)=>{const div=document.createElement('div');div.className='slot';if(u){const name=document.createElement('strong');name.textContent=u.card.name;const meta=document.createElement('small');meta.textContent=`HP ${u.hp} / ATK ${stat(u.card,'atk',12)} / DEF ${stat(u.card,'def',0)}`;div.append(name,meta);if(!enemy){const b=document.createElement('button');b.textContent=u.newborn?'召喚直後':u.used?'攻撃済み':'攻撃';b.disabled=state.over||u.used||u.newborn;b.onclick=()=>attack(me,cpu,i,true);div.append(b)}}else div.textContent='空き枠';$(node).append(div)})}const hand=$('hand');hand.replaceChildren();me.hand.forEach((id,i)=>{const c=card(id);if(!c)return;const div=document.createElement('div');div.className='card';const title=document.createElement('strong');title.textContent=c.name;const meta=document.createElement('small');meta.textContent=`${c.type} / ★${c.rarity} / コスト ${c.cost}`;const stats=document.createElement('small');stats.textContent=unit(c)?`HP ${c.hp??'—'} / ATK ${c.atk??'—'} / DEF ${c.def??'—'}`:'効果は未実装';const b=document.createElement('button');b.textContent=unit(c)?'召喚':'未実装';b.disabled=state.over||!unit(c)||me.hand.length-1<stat(c,'cost',0)||me.field.every(Boolean);b.onclick=()=>play(i);div.append(title,meta,stats,b);hand.append(div)})}
$('start').onclick=start;$('end').onclick=endTurn;
(async()=>{try{const r=await fetch('./cards.json');if(!r.ok)throw Error('cards.json が見つかりません');const data=await r.json();cards=data.cards;if(!Array.isArray(cards)||!cards.length)throw Error('カードデータが不正です');map=new Map(cards.map(c=>[c.id,c]));saved=JSON.parse(localStorage.getItem(STORE)||'{}');const slots=Object.entries(saved).filter(([k,v])=>Array.isArray(v?.cards)&&v.cards.length===40);$('decks').replaceChildren();for(const[k,v]of slots){const o=document.createElement('option');o.value=k;o.textContent=`保存枠${k}：${v.name||'無題'}`;$('decks').append(o)}$('start').disabled=!slots.length;note(slots.length?`デッキ${slots.length}件を検出。対戦を開始できます。`:'保存済み40枚デッキがありません。先にデッキ編集で保存してください。')}catch(e){note('読み込み失敗：'+e.message)}})();
</script></body></html>
