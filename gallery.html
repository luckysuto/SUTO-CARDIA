<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUTO CARDIA | カード図鑑</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a1221;color:#f1f5ff}header{padding:18px max(16px,calc((100vw - 1080px)/2));background:#14223a;border-bottom:1px solid #41516e;display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#bed4ff}h1{font-size:1.25rem;margin:0}main{max-width:1080px;margin:auto;padding:20px 14px}.controls{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin-bottom:12px}input,select{width:100%;background:#1a2c46;color:#fff;border:1px solid #526582;border-radius:9px;padding:12px;font-size:1rem}.count{color:#aebdd4;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.card{background:linear-gradient(155deg,#223955,#121f33);border:1px solid #526582;border-radius:13px;padding:13px;min-height:205px}.card h2{font-size:1rem;margin:5px 0 9px;overflow-wrap:anywhere}.meta{font-size:.85rem;color:#d2dffa}.tag{display:inline-block;border:1px solid #6c82a6;border-radius:20px;padding:3px 8px;font-size:.75rem;margin-right:4px}.stats{font-size:.85rem;margin:10px 0}.effect{font-size:.86rem;line-height:1.55;color:#dce7f9;overflow-wrap:anywhere}.hint{font-size:.8rem;color:#aebdd4;margin-top:8px}button{background:#a8c7ff;color:#0a1b32;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.pages{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px;min-height:190px}.card h2{font-size:.9rem}}
</style></head><body><header><h1>SUTO CARDIA　カード図鑑</h1><a href="index.html">ホームへ戻る</a></header><main>
<div class="controls"><input id="search" placeholder="カード名・能力・IDで検索" aria-label="カード検索"><select id="type" aria-label="種類"><option value="">全種類</option></select><select id="element" aria-label="属性"><option value="">全属性</option></select><select id="rarity" aria-label="レアリティ"><option value="">全レアリティ</option></select></div>
<p id="count" class="count" role="status">500枚のデータを読み込んでいます…</p><section id="cards" class="cards" aria-label="カード一覧"></section><div class="pages"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></div>
<p class="hint">カードの数値・能力は暫定版です。イラストと戦闘機能は未実装。ここでは公開カードデータのみ表示します。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let all=[],filtered=[],page=0;const pageSize=24;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e;}
function choices(id,values,prefix){for(const value of [...new Set(values.filter(x=>x!==null&&x!==undefined&&x!==''))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))){const option=el('option','',prefix?prefix(value):value);option.value=String(value);$(id).append(option);}}
function render(){const area=$('cards');area.replaceChildren();const start=page*pageSize;for(const c of filtered.slice(start,start+pageSize)){const item=el('article','card');item.append(el('div','meta',`${c.id}　${'★'.repeat(Math.min(7,Number(c.rarity)||1))}`),el('h2','',c.name));const tags=el('div');tags.append(el('span','tag',c.type),el('span','tag',c.element||'無属性'),el('span','tag',`コスト ${c.cost}`));item.append(tags);if(c.type==='ユニット')item.append(el('p','stats',`HP ${c.hp}｜攻 ${c.attack}｜防 ${c.defense}｜速 ${c.speed}｜射程 ${c.range}`));item.append(el('p','effect',c.effect||'効果なし'),el('div','hint',`入手：${c.acquisition||'未設定'}`));area.append(item);}const total=Math.max(1,Math.ceil(filtered.length/pageSize));$('page').textContent=`${page+1} / ${total}`;$('prev').disabled=page===0;$('next').disabled=page+1>=total;$('count').textContent=`${filtered.length} / ${all.length} 種類を表示`;}
function apply(){const q=$('search').value.trim().toLocaleLowerCase('ja');filtered=all.filter(c=>(!q||[c.name,c.id,c.effect].some(x=>String(x||'').toLocaleLowerCase('ja').includes(q)))&&(!$('type').value||c.type===$('type').value)&&(!$('element').value||c.element===$('element').value)&&(!$('rarity').value||String(c.rarity)===$('rarity').value));page=0;render();}
for(const id of ['search','type','element','rarity'])$(id).addEventListener(id==='search'?'input':'change',apply);
$('prev').addEventListener('click',()=>{if(page>0){page--;render();window.scrollTo({top:0,behavior:'smooth'});}});$('next').addEventListener('click',()=>{if((page+1)*pageSize<filtered.length){page++;render();window.scrollTo({top:0,behavior:'smooth'});}});
fetch('./cards.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json();}).then(data=>{if(!Array.isArray(data.cards)||data.cards.length!==500)throw Error('cards.jsonの形式またはカード数が一致しません');all=data.cards;choices('type',all.map(c=>c.type));choices('element',all.map(c=>c.element));choices('rarity',all.map(c=>c.rarity),n=>'★'+n);apply();}).catch(e=>{$('count').textContent='読み込み失敗：'+e.message+'。cards.jsonを同じ階層に置いてください。';$('page').textContent='—';$('prev').disabled=$('next').disabled=true;});
</script></body></html>
